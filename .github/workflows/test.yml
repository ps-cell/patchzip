name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: bash -n patchzip tests/test_patchzip.sh install.sh
      - name: Run tests
        run: bash tests/test_patchzip.sh
